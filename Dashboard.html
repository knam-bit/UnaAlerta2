<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Monitoramento Hídrico</title>
  <style>
    :root {
      --primary: #1c4587;
      --bg: #f5f5f5;
      --card-bg: white;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    details {
      width: 100%;
    }

    summary {
      padding: 15px;
      background: #fff;
      cursor: pointer;
      font-weight: bold;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    summary:hover {
      background: #f9f9f9;
    }

    summary::after {
      content: '+';
      font-size: 1.5em;
      color: var(--primary);
    }

    details[open] summary::after {
      content: '-';
    }

    .content {
      padding: 15px;
      border-top: 1px solid #eee;
    }

    .chart-img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      border: 1px solid #ddd;
    }

    /* --- CHATBOT ULTRA RESILIENTE UI --- */
    .chatbot-zone {
      margin-top: 15px;
      border-top: 1px solid #eee;
      padding: 20px;
      background: #fafafa;
      border-radius: 0 0 8px 8px;
    }

    .chat-header {
      font-size: 0.95em;
      color: #444;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .chat-box {
      height: 220px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow-y: auto;
      padding: 15px;
      margin-bottom: 12px;
      font-size: 0.92em;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
    }

    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      display: inline-block;
      max-width: 85%;
      line-height: 1.5;
      animation: fadeIn 0.3s ease-out;
      position: relative;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      margin-left: auto;
      border-bottom-right-radius: 2px;
    }

    .msg.bot {
      background: #f1f3f4;
      color: #1a1a1a;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid #e8e8e8;
    }

    .msg.loading {
      background: transparent;
      color: #888;
      font-style: italic;
      align-self: flex-start;
      padding: 5px;
      border: none;
    }

    .chat-input {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(28, 69, 135, 0.1);
    }

    button {
      padding: 8px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: #16366b;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* Scrollbar premium */
    .chat-box::-webkit-scrollbar {
      width: 6px;
    }

    .chat-box::-webkit-scrollbar-track {
      background: #f5f5f5;
    }

    .chat-box::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌊 Painel de Inteligência Limnológica - Lago Paranoá</h1>

    <div class="grid" id="dashboard-grid">
      <!-- Cards serão injetados aqui se tivermos URLs, caso contrário, placeholders -->
      <? var charts = [
          '01_KDE_Fosforo_Total', '02_KDE_Clorofila_a', '03_Violin_IQA_Pontos', 
          '04_Barras_Empilhadas_Eutrofizacao', '05_Radar_Sedimentos_Interno', '06_KDE_Turbidez_Suspensao',
          '07_Violin_Microplasticos', '08_Barras_Empilhadas_Denuncias', '09_Radar_Compliance_Outorgas',
          '10_Histograma_Loteamentos', '11_Violin_pH_Anoxia', '12_Barras_Biodiversidade_Stress'
        ]; ?>

      <? for (var i = 0; i < charts.length; i++) { ?>
      <div class="card">
        <details open>
          <summary>
            <?= charts[i].replace(/_/g, ' ') ?>
          </summary>
          <div class="content">
            <!-- Placeholder image or real URL passed from global 'chartUrls' if available -->
            <img src="https://via.placeholder.com/600x400?text=Gerando+Grafico+<?= i+1 ?>..."
              data-name="<?= charts[i] ?>" class="chart-img" alt="Gráfico <?= charts[i] ?>">

            <div class="chatbot-zone" id="zone-<?= i ?>" data-chart="<?= charts[i] ?>">
              <div class="chat-header">
                <span>🤖</span> <strong>IA Especialista</strong> &mdash; Análise de Dados
              </div>
              <div class="chat-box" id="chat-box-<?= i ?>">
                <div class="msg bot">Olá! Analisei o gráfico <strong><?= charts[i].replace(/_/g, ' ') ?></strong>. Detectei padrões importantes. O que deseja aprofundar?</div>
              </div>
              <div class="chat-input">
                <input type="text" id="input-<?= i ?>" placeholder="Ex: Qual a tendência de fósforo?"
                  onkeypress="handleKey(event, '<?= i ?>')">
                <button id="btn-<?= i ?>" onclick="sendMessage('<?= i ?>')">Enviar</button>
              </div>
            </div>
          </div>
        </details>
      </div>
      <? } ?>
    </div>
  </div>

  <script>
    function handleKey(e, id) {
      if (e.key === 'Enter') sendMessage(id);
    }

    function sendMessage(id) {
      var input = document.getElementById('input-' + id);
      var btn = document.getElementById('btn-' + id);
      var text = input.value.trim();
      if (!text) return;

      var box = document.getElementById('chat-box-' + id);
      var zone = document.getElementById('zone-' + id);
      var chartName = zone ? zone.getAttribute('data-chart') : "Gráfico " + id;

      // 1. Mostrar mensagem do usuário
      var userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.innerText = text;
      box.appendChild(userDiv);
      input.value = '';
      
      // Bloquear interface
      input.disabled = true;
      btn.disabled = true;
      
      // Auto-scroll
      box.scrollTop = box.scrollHeight;

      // 2. Feedback de "Digitando..."
      var loadingDiv = document.createElement('div');
      loadingDiv.className = 'msg loading';
      loadingDiv.id = 'loading-' + id;
      loadingDiv.innerHTML = '<span>⏳</span> Processando contexto...';
      box.appendChild(loadingDiv);
      box.scrollTop = box.scrollHeight;

      // 3. Conexão Real com Backend (ou Simulação Fallback)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(response) {
             var reply = (response && response.response) ? response.response : "Não foi possível obter resposta do modelo.";
             appendBotResponse(id, reply);
          })
          .withFailureHandler(function(err) {
             appendBotResponse(id, "Erro de conexão: " + err.message, true);
          })
          .sendGeminiChat(text, chartName); // Passa nome do gráfico como contexto
      } else {
        // Fallback para desenvolvimento local
        setTimeout(function () {
          var mockReply = "Resposta simulada sobre <strong>" + chartName + "</strong> para: '" + text + "'. <br>No ambiente real, isso será processado pelo Gemini.";
          appendBotResponse(id, mockReply);
        }, 1200);
      }
    }

    function appendBotResponse(id, text, isError) {
        var box = document.getElementById('chat-box-' + id);
        var input = document.getElementById('input-' + id);
        var btn = document.getElementById('btn-' + id);
        var loading = document.getElementById('loading-' + id);

        if(loading) loading.remove();

        var botDiv = document.createElement('div');
        botDiv.className = 'msg bot';
        if(isError) botDiv.style.borderLeft = "4px solid #ef5350";
        
        // Simples parser para negrito **texto** -> <b>texto</b> (básico)
        text = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        botDiv.innerHTML = text;
        
        box.appendChild(botDiv);
        box.scrollTop = box.scrollHeight;

        // Desbloquear interface
        input.disabled = false;
        btn.disabled = false;
        input.focus();
    }

    // Load real images if available via GAS runner
    window.onload = function () {
      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(updateImages).getChartImageUrls();
      }
    };

    function updateImages(urls) {
      if (!urls) return;
      var imgs = document.querySelectorAll('img[data-name]');
      imgs.forEach(function (img) {
        var name = img.getAttribute('data-name');
        if (urls[name]) {
          img.src = urls[name];
        }
      });
    }
  </script>
</body>
</html>
