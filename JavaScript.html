<script>
  /**
   * @file JavaScript.html
   * @description Sistema de navegação fluida com suporte ao History API e GPS real
   * @version 2.0 - Otimizado para Samsung S20 / Comet Browser
   */

  var NavigationHelper = {
    // Cache de estado para navegação rápida
    _viewStack: [],
    _isTransitioning: false,
    _lastView: null,
    _scrollPositions: {},

    /**
     * Inicializa o sistema de navegação com History API
     */
    init: function () {
      var self = this;

      // Listener para botão voltar do navegador
      window.addEventListener('popstate', function (event) {
        if (event.state && event.state.viewId) {
          self._navigateWithoutPush(event.state.viewId);
        } else {
          // Se não tem estado, volta para home
          self._navigateWithoutPush('view-dashboard');
        }
      });

      // Previne comportamento padrão de links internos
      document.addEventListener('click', function (e) {
        var target = e.target.closest('[data-view]');
        if (target) {
          e.preventDefault();
          self.navigateTo(target.dataset.view);
        }
      });

      // Salva posição de scroll ao navegar
      window.addEventListener('scroll', function () {
        var currentView = self._getCurrentView();
        if (currentView) {
          self._scrollPositions[currentView] = window.scrollY;
        }
      }, { passive: true });

      // Define estado inicial
      var initialView = this._getCurrentView() || 'view-dashboard';
      history.replaceState({ viewId: initialView }, '', window.location.href);

      console.log('NavigationHelper v2.0 iniciado - Suporte History API ativo');
    },

    /**
     * Retorna a view atualmente ativa
     */
    _getCurrentView: function () {
      var activeView = document.querySelector('.app-view.active');
      return activeView ? activeView.id : null;
    },

    /**
     * Navega para uma view específica com animação fluida
     * @param {string} viewId - O ID da div que representa a view
     * @param {Object} options - Opções de navegação
     */
    navigateTo: function (viewId, options) {
      options = options || {};
      var self = this;

      // Evita navegação dupla ou durante transição
      if (this._isTransitioning) return;
      if (this._getCurrentView() === viewId && !options.force) return;

      // Salva posição do scroll da view atual
      var currentView = this._getCurrentView();
      if (currentView) {
        this._scrollPositions[currentView] = window.scrollY;
      }

      // Marca como em transição
      this._isTransitioning = true;

      // Adiciona ao histórico (se não for navegação via popstate)
      if (!options.skipHistory) {
        var url = window.location.pathname + '#' + viewId;
        history.pushState({ viewId: viewId }, '', url);

        // Adiciona ao stack de navegação
        if (currentView && currentView !== viewId) {
          this._viewStack.push(currentView);
        }
      }

      // Executa a transição
      this._performTransition(viewId, currentView, function () {
        self._isTransitioning = false;

        // Restaura posição do scroll se existir
        if (self._scrollPositions[viewId]) {
          window.scrollTo(0, self._scrollPositions[viewId]);
        } else {
          window.scrollTo(0, 0);
        }
      });
    },

    /**
     * Navega sem adicionar ao histórico (usado pelo popstate)
     */
    _navigateWithoutPush: function (viewId) {
      this.navigateTo(viewId, { skipHistory: true });
    },

    /**
     * Executa a transição visual entre views
     */
    _performTransition: function (targetViewId, currentViewId, callback) {
      var views = document.querySelectorAll('.app-view');
      var targetView = document.getElementById(targetViewId);

      if (!targetView) {
        console.error('View não encontrada:', targetViewId);
        callback();
        return;
      }

      // Adiciona classe de saída na view atual
      views.forEach(function (view) {
        if (view.classList.contains('active')) {
          view.classList.add('view-exit');
        }
      });

      // Aguarda um frame para a animação de saída
      requestAnimationFrame(function () {
        // Remove active de todas
        views.forEach(function (view) {
          view.classList.remove('active', 'view-exit');
        });

        // Adiciona classe de entrada na nova view
        targetView.classList.add('active', 'view-enter');

        // Atualiza estado visual do menu
        NavigationHelper.updateActiveTab(targetViewId);

        // Remove classe de animação após a transição
        setTimeout(function () {
          targetView.classList.remove('view-enter');
          console.log('Navegado para:', targetViewId);
          callback();
        }, 300);
      });
    },

    /**
     * Atualiza a classe 'active' nos elementos do menu de navegação
     * Suporta tanto .tab (legado) quanto .nav-btn (novo)
     */
    updateActiveTab: function (viewId) {
      // Atualiza tabs legadas
      var tabs = document.querySelectorAll('.tab');
      tabs.forEach(function (t) {
        t.classList.remove('active');
        var onclick = t.getAttribute('onclick');
        if (onclick && onclick.includes(viewId)) {
          t.classList.add('active');
        }
      });

      // Atualiza novos botões de navegação no header
      var navBtns = document.querySelectorAll('.nav-btn');
      navBtns.forEach(function (btn) {
        btn.classList.remove('active');
        var onclick = btn.getAttribute('onclick');
        if (onclick && onclick.includes(viewId)) {
          btn.classList.add('active');
        }
      });
    },

    /**
     * Volta para a view anterior (usando histórico do navegador)
     */
    goBack: function () {
      if (this._viewStack.length > 0) {
        history.back();
      } else {
        // Se não tem histórico, volta para home
        this.navigateTo('view-dashboard');
      }
    },

    /**
     * Helper para voltar para a home
     */
    goHome: function () {
      this.navigateTo('view-dashboard');
    },

    /**
     * Verifica se pode voltar
     */
    canGoBack: function () {
      return this._viewStack.length > 0;
    }
  };

  /**
   * GPS Helper - Otimizado para Samsung S20 / Comet Browser
   * Suporta fallback e cache de localização
   */
  var GPSHelper = {
    _lastPosition: null,
    _watchId: null,
    _isSupported: null,

    /**
     * Verifica suporte a geolocalização
     */
    isSupported: function () {
      if (this._isSupported === null) {
        this._isSupported = 'geolocation' in navigator;
      }
      return this._isSupported;
    },

    /**
     * Obtém posição atual com alta precisão
     * @param {Function} onSuccess - Callback com {lat, lng, accuracy}
     * @param {Function} onError - Callback de erro
     * @param {Object} options - Opções adicionais
     */
    getCurrentPosition: function (onSuccess, onError, options) {
      var self = this;
      options = options || {};

      if (!this.isSupported()) {
        onError && onError({
          code: 0,
          message: 'Geolocalização não suportada neste navegador'
        });
        return;
      }

      // Opções otimizadas para Samsung S20 / Comet Browser
      var geoOptions = {
        enableHighAccuracy: options.highAccuracy !== false, // Alta precisão por padrão
        timeout: options.timeout || 15000, // 15 segundos timeout
        maximumAge: options.maxAge || 30000 // Cache de 30 segundos
      };

      navigator.geolocation.getCurrentPosition(
        function (position) {
          var result = {
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            accuracy: position.coords.accuracy,
            altitude: position.coords.altitude,
            timestamp: position.timestamp
          };

          // Cache da última posição
          self._lastPosition = result;

          onSuccess && onSuccess(result);
        },
        function (error) {
          var errorMsg = '';
          switch (error.code) {
            case error.PERMISSION_DENIED:
              errorMsg = 'Permissão de localização negada. Por favor, habilite nas configurações.';
              break;
            case error.POSITION_UNAVAILABLE:
              errorMsg = 'Localização não disponível. Verifique se o GPS está ligado.';
              break;
            case error.TIMEOUT:
              errorMsg = 'Tempo de requisição expirou. Tente novamente.';
              break;
            default:
              errorMsg = 'Erro desconhecido ao obter localização.';
          }

          onError && onError({
            code: error.code,
            message: errorMsg,
            original: error
          });
        },
        geoOptions
      );
    },

    /**
     * Inicia monitoramento contínuo de posição
     * @param {Function} onUpdate - Callback com posição atualizada
     * @param {Function} onError - Callback de erro
     */
    watchPosition: function (onUpdate, onError) {
      var self = this;

      if (!this.isSupported()) {
        onError && onError({
          code: 0,
          message: 'Geolocalização não suportada'
        });
        return null;
      }

      // Para watch anterior se existir
      this.stopWatch();

      this._watchId = navigator.geolocation.watchPosition(
        function (position) {
          var result = {
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            accuracy: position.coords.accuracy,
            altitude: position.coords.altitude,
            timestamp: position.timestamp
          };

          self._lastPosition = result;
          onUpdate && onUpdate(result);
        },
        function (error) {
          onError && onError({
            code: error.code,
            message: 'Erro ao monitorar posição'
          });
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 5000
        }
      );

      return this._watchId;
    },

    /**
     * Para monitoramento de posição
     */
    stopWatch: function () {
      if (this._watchId !== null) {
        navigator.geolocation.clearWatch(this._watchId);
        this._watchId = null;
      }
    },

    /**
     * Retorna última posição conhecida (cache)
     */
    getLastPosition: function () {
      return this._lastPosition;
    },

    /**
     * Formata coordenadas para exibição
     * @param {number} lat - Latitude
     * @param {number} lng - Longitude
     * @param {number} precision - Casas decimais (padrão 6)
     */
    formatCoords: function (lat, lng, precision) {
      precision = precision || 6;
      return lat.toFixed(precision) + ', ' + lng.toFixed(precision);
    },

    /**
     * Valida se coordenadas estão na região do Lago Paranoá
     * @param {number} lat - Latitude
     * @param {number} lng - Longitude
     */
    isInLagoParanoaRegion: function (lat, lng) {
      // Bounding box aproximada do Lago Paranoá e entorno
      var bounds = {
        north: -15.60,
        south: -15.90,
        east: -47.70,
        west: -48.00
      };

      return lat >= bounds.south && lat <= bounds.north &&
        lng >= bounds.west && lng <= bounds.east;
    }
  };

  /**
   * UI Feedback Helper - Transições e feedback visual
   */
  var UIHelper = {
    /**
     * Mostra loading overlay
     */
    showLoading: function (message) {
      var loader = document.getElementById('global-loader');
      if (!loader) {
        loader = document.createElement('div');
        loader.id = 'global-loader';
        loader.className = 'loading-overlay';
        loader.innerHTML = '<div class="loading-spinner"></div>' +
          '<span class="loading-text">' + (message || 'Carregando...') + '</span>';
        document.body.appendChild(loader);
      } else {
        var text = loader.querySelector('.loading-text');
        if (text) text.textContent = message || 'Carregando...';
      }
      loader.classList.add('visible');
    },

    /**
     * Esconde loading overlay
     */
    hideLoading: function () {
      var loader = document.getElementById('global-loader');
      if (loader) {
        loader.classList.remove('visible');
      }
    },

    /**
     * Mostra toast notification
     */
    showToast: function (message, type, duration) {
      type = type || 'info';
      duration = duration || 3000;

      var toast = document.createElement('div');
      toast.className = 'toast-notification toast-' + type;
      toast.textContent = message;

      document.body.appendChild(toast);

      // Trigger animation
      requestAnimationFrame(function () {
        toast.classList.add('visible');
      });

      // Remove after duration
      setTimeout(function () {
        toast.classList.remove('visible');
        setTimeout(function () {
          toast.remove();
        }, 300);
      }, duration);
    },

    /**
     * Feedback de vibração (se suportado)
     * Útil para confirmação de ações em mobile
     */
    vibrate: function (pattern) {
      if ('vibrate' in navigator) {
        pattern = pattern || [50];
        navigator.vibrate(pattern);
      }
    },

    /**
     * Inicializa tema baseado em preferência salva ou sistema
     */
    initTheme: function() {
      var savedTheme = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.body.classList.add('dark-mode');
      }

      // Listener para mudanças de preferência do sistema
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem('theme')) {
          if (e.matches) {
            document.body.classList.add('dark-mode');
          } else {
            document.body.classList.remove('dark-mode');
          }
        }
      });
    }
  };

  /**
   * Toggle de tema com persistência
   */
  function toggleTheme() {
    var body = document.body;
    var isDark = body.classList.toggle('dark-mode');
    
    // Persiste preferência
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    
    // Feedback visual
    if (typeof UIHelper !== 'undefined') {
      UIHelper.vibrate([30]);
      UIHelper.showToast(
        isDark ? '🌙 Modo escuro ativado' : '☀️ Modo claro ativado',
        'info',
        2000
      );
    }

    // Atualiza ícone do botão
    updateThemeIcon(isDark);
  }

  /**
   * Atualiza ícone do botão de tema
   */
  function updateThemeIcon(isDark) {
    var themeBtn = document.querySelector('.nav-btn[onclick*="toggleTheme"]');
    if (!themeBtn) return;

    var svg = themeBtn.querySelector('svg');
    if (!svg) return;

    if (isDark) {
      // Ícone de sol (modo claro disponível)
      svg.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
    } else {
      // Ícone de lua (modo escuro disponível)
      svg.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
  }

  // Inicialização: Configura navegação e estado inicial
  document.addEventListener('DOMContentLoaded', function () {
    // Inicializa tema antes de tudo
    if (typeof UIHelper !== 'undefined') {
      UIHelper.initTheme();
      updateThemeIcon(document.body.classList.contains('dark-mode'));
    }

    // Inicializa sistema de navegação
    NavigationHelper.init();

    // Verifica hash na URL para navegação direta
    var hash = window.location.hash;
    if (hash && hash.startsWith('#view-')) {
      var viewId = hash.substring(1);
      if (document.getElementById(viewId)) {
        NavigationHelper.navigateTo(viewId, { skipHistory: true });
        return;
      }
    }

    // Garante que a view inicial esteja visível
    if (document.getElementById('view-dashboard')) {
      NavigationHelper.navigateTo('view-dashboard', { skipHistory: true, force: true });
    } else if (document.getElementById('view-home')) {
      NavigationHelper.navigateTo('view-home', { skipHistory: true, force: true });
    } else {
      // Fallback para primeira view encontrada
      var first = document.querySelector('.app-view');
      if (first) {
        NavigationHelper.navigateTo(first.id, { skipHistory: true, force: true });
      }
    }

    console.log('GPS Helper:', GPSHelper.isSupported() ? 'Disponível' : 'Não disponível');
  });
</script>
