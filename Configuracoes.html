<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .config-group {
      margin: 15px 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background: #4a86e8;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #3a76d8;
    }
  </style>
</head>
<body>
  <h3>⚙️ Configurações</h3>
  
  <div class="config-group">
    <label>URL da API ADASA:</label>
    <input type="text" id="apiUrl" placeholder="https://api.adasa.gov.br/...">
  </div>
  
  <div class="config-group">
    <label>Frequência de Atualização:</label>
    <select id="updateFreq">
      <option value="daily">Diária</option>
      <option value="weekly">Semanal</option>
      <option value="monthly">Mensal</option>
    </select>
  </div>
  
  <div class="config-group">
    <label>Email para Relatórios:</label>
    <input type="email" id="emailRelatorio" placeholder="seu@email.com">
  </div>
  
  <button onclick="salvarConfiguracoes()">💾 Salvar Configurações</button>
  
  <script>
    function salvarConfiguracoes() {
      const config = {
        apiUrl: document.getElementById('apiUrl').value,
        updateFreq: document.getElementById('updateFreq').value,
        email: document.getElementById('emailRelatorio').value
      };
      
      google.script.run
        .withSuccessHandler(() => {
          alert('Configurações salvas com sucesso!');
          google.script.host.close();
        })
        .salvarConfiguracoesScript(config);
    }
  </script>
</body>
</html>
